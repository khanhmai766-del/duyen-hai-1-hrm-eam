# Giới hạn cứng cho journald — trước đây không đặt, log hệ thống lên tới 2.8GB (2026-09-13).
# Cài: mkdir -p /etc/systemd/journald.conf.d && cp scripts/systemd/journald-dh1-limit.conf \
#      /etc/systemd/journald.conf.d/dh1-limit.conf && systemctl restart systemd-journald
[Journal]
SystemMaxUse=500M
MaxRetentionSec=1month
